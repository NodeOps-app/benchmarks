name: Sandbox Dax Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/sandbox/dax*.ts'
      - 'benchmarks/src/util/**'
      - 'benchmarks/sandbox/providers.ts'
      - 'benchmarks/scripts/dax-benchmark.sh'
      - 'package.json'
      - '.github/workflows/sandbox-dax-benchmarks.yml'
  schedule:
    - cron: '30 13 * * 5' # Weekly on Friday at 1:30pm UTC (8:30am CDT, offset from TTI to avoid provider contention)
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per provider'
        required: false
        default: '1'
      provider:
        description: 'Provider to run (leave empty for all)'
        required: false
        default: ''

concurrency:
  group: dax-benchmarks
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dax:
    name: Dax ${{ matrix.provider }}
    runs-on: namespace-profile-default
    # runs-on: self-hosted
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider:
          # - archil
          # - arker
          # - beam
          # - blaxel
          # - cloud-run
          # - cloudflare
          # - codesandbox
          - createos
          # - daytona
          # - declaw
          # - e2b
          # - hopx
          # - isorun
          # - lightning
          # - modal
          # - mosaic
          # - namespace
          # - northflank
          # - opencomputer
          # - run-cloud
          # - runloop
          # - sail
          # - sandbox0
          # - superserve
          # - tenki
          # - tensorlake
          # - upstash
          - vercel
    steps:
      - name: Select provider
        id: selection
        env:
          REQUESTED_PROVIDER: ${{ github.event.inputs.provider }}
          MATRIX_PROVIDER: ${{ matrix.provider }}
        run: |
          if [ -z "$REQUESTED_PROVIDER" ] || [ "$REQUESTED_PROVIDER" = "$MATRIX_PROVIDER" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.selection.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.selection.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.selection.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.selection.outputs.enabled == 'true'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm update
          else
            pnpm install --frozen-lockfile
          fi
      - name: Build E2B template with 8 vCPU / 16 GiB
        if: steps.selection.outputs.enabled == 'true' && matrix.provider == 'e2b'
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          npx tsx benchmarks/scripts/build-e2b-template.ts
      - name: Build Superserve template with 8 vCPU / 16 GiB
        if: steps.selection.outputs.enabled == 'true' && matrix.provider == 'superserve'
        env:
          SUPERSERVE_API_KEY: ${{ secrets.SUPERSERVE_API_KEY }}
        run: |
          npx tsx benchmarks/scripts/build-superserve-template.ts
      - name: Find Northflank plan for 8 vCPU / 16 GiB
        if: steps.selection.outputs.enabled == 'true' && matrix.provider == 'northflank'
        env:
          NORTHFLANK_TOKEN: ${{ secrets.NORTHFLANK_TOKEN }}
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}
        run: |
          npx tsx benchmarks/scripts/find-northflank-plan.ts
      - name: Run dax benchmark
        if: steps.selection.outputs.enabled == 'true'
        env:
          BENCH_PROVIDER: ${{ matrix.provider }}
          BENCH_ITERATIONS: ${{ github.event.inputs.iterations || '1' }}
          # Load credentials directly from GitHub Actions secrets, as in TTI.
          ARCHIL_API_KEY: ${{ secrets.ARCHIL_API_KEY }}
          ARCHIL_REGION: ${{ secrets.ARCHIL_REGION }}
          ARCHIL_DISK_ID: ${{ secrets.ARCHIL_DISK_ID }}
          ARKER_API_KEY: ${{ secrets.ARKER_API_KEY }}
          BEAM_TOKEN: ${{ secrets.BEAM_TOKEN }}
          BEAM_WORKSPACE_ID: ${{ secrets.BEAM_WORKSPACE_ID }}
          BL_API_KEY: ${{ secrets.BL_API_KEY }}
          BL_WORKSPACE: ${{ secrets.BL_WORKSPACE }}
          BL_DAX_API_KEY: ${{ secrets.BL_DAX_API_KEY }}
          BL_DAX_WORKSPACE: ${{ secrets.BL_DAX_WORKSPACE }}
          CLOUD_RUN_SANDBOX_URL: ${{ secrets.CLOUD_RUN_SANDBOX_URL }}
          CLOUD_RUN_SANDBOX_SECRET: ${{ secrets.CLOUD_RUN_SANDBOX_SECRET }}
          CLOUDFLARE_SANDBOX_URL: ${{ secrets.CLOUDFLARE_SANDBOX_URL }}
          CLOUDFLARE_SANDBOX_SECRET: ${{ secrets.CLOUDFLARE_SANDBOX_SECRET }}
          CSB_API_KEY: ${{ secrets.CSB_API_KEY }}
          CREATEOS_SANDBOX_API_KEY: ${{ secrets.CREATEOS_SANDBOX_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          DECLAW_API_KEY: ${{ secrets.DECLAW_API_KEY }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          HOPX_API_KEY: ${{ secrets.HOPX_API_KEY }}
          ISORUN_API_KEY: ${{ secrets.ISORUN_API_KEY }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MOSAIC_API_URL: ${{ secrets.MOSAIC_API_URL }}
          MOSAIC_API_TOKEN: ${{ secrets.MOSAIC_API_TOKEN }}
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
          NORTHFLANK_TOKEN: ${{ secrets.NORTHFLANK_TOKEN }}
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}
          OPENCOMPUTER_API_KEY: ${{ secrets.OPENCOMPUTER_API_KEY }}
          OPENCOMPUTER_API_URL: ${{ secrets.OPENCOMPUTER_API_URL }}
          RUN_CLOUD_API_KEY: ${{ secrets.RUN_CLOUD_API_KEY }}
          RUNLOOP_API_KEY: ${{ secrets.RUNLOOP_API_KEY }}
          SAIL_API_KEY: ${{ secrets.SAIL_API_KEY }}
          SANDBOX0_TOKEN: ${{ secrets.SANDBOX0_TOKEN }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          SUPERSERVE_API_KEY: ${{ secrets.SUPERSERVE_API_KEY }}
          TENKI_API_KEY: ${{ secrets.TENKI_API_KEY }}
          TENSORLAKE_API_KEY: ${{ secrets.TENSORLAKE_API_KEY }}
          UPSTASH_BOX_API_KEY: ${{ secrets.UPSTASH_BOX_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          LIGHTNING_INSTANCE_TYPE: cpu-8 # 8 vCPU / 16 GiB, matching the standardized dax profile
          ARKER_PLATFORMS: graviton4 # dax only; elsewhere Arker picks the platform automatically
        run: |
          # If dedicated DAX Blaxel credentials are provisioned, route them to the
          # standard names that providers.ts expects, so no provider fork is needed.
          if [ -n "${BL_DAX_API_KEY:-}" ] && [ -n "${BL_DAX_WORKSPACE:-}" ]; then
            export BL_API_KEY="$BL_DAX_API_KEY"
            export BL_WORKSPACE="$BL_DAX_WORKSPACE"
            unset BL_DAX_API_KEY BL_DAX_WORKSPACE
          fi

          pnpm run bench:sandbox:dax \
            --provider "$BENCH_PROVIDER" \
            --iterations "$BENCH_ITERATIONS"
