name: Sandbox TTI Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/sandbox/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per provider'
        required: false
        default: '100'
      concurrency:
        description: 'Concurrent sandboxes'
        required: false
        default: '100'

permissions:
  contents: write

jobs:
  bench:
    name: Bench ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider:
          - createos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run benchmark
        env:
          CREATEOS_SANDBOX_API_KEY: ${{ secrets.CREATEOS_SANDBOX_API_KEY }}
        run: |
          npx tsx benchmarks/sandbox/tti.bench.ts \
            --provider ${{ matrix.provider }} \
            --iterations ${{ github.event.inputs.iterations || '100' }} \
            --concurrency ${{ github.event.inputs.concurrency || '100' }}
      - name: Summary
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const latest = 'results/burst_tti/latest.json';
          if (!fs.existsSync(latest)) { console.log('No results found'); process.exit(0); }
          const data = JSON.parse(fs.readFileSync(latest, 'utf-8'));
          const rows = [];
          for (const r of data.results) {
            const times = r.iterations.filter(i => !i.error).map(i => i.ttiMs).sort((a,b) => a-b);
            if (!times.length) { rows.push({ provider: r.provider, ok: 0, total: r.iterations.length }); continue; }
            const pct = p => times[Math.min(Math.ceil(p/100*times.length)-1, times.length-1)];
            const avg = times.reduce((a,b) => a+b, 0) / times.length;
            rows.push({ provider: r.provider, ok: times.length, total: r.iterations.length, min: times[0], p50: pct(50), p90: pct(90), p95: pct(95), p99: pct(99), max: times[times.length-1], avg });
          }
          rows.sort((a,b) => (a.p50||Infinity) - (b.p50||Infinity));
          const ms = v => v !== undefined ? v.toFixed(0) + ' ms' : 'FAIL';
          const hdr = ['#', 'Provider', 'Ok/Total', 'Min', 'P50', 'P90', 'P95', 'P99', 'Max', 'Avg'];
          const sep = hdr.map(h => '-'.repeat(h.length > 8 ? h.length : 8));
          console.log('');
          console.log(hdr.join(' | '));
          console.log(sep.join(' | '));
          rows.forEach((r, i) => {
            console.log([i+1, r.provider, r.ok+'/'+r.total, ms(r.min), ms(r.p50), ms(r.p90), ms(r.p95), ms(r.p99), ms(r.max), ms(r.avg)].join(' | '));
          });
          console.log('');
          "
