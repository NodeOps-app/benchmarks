name: Sandbox TTI Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/sandbox/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per provider'
        required: false
        default: '10'
      concurrency:
        description: 'Concurrent sandboxes'
        required: false
        default: '10'

permissions:
  contents: write

jobs:
  bench:
    name: Bench ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider:
          - createos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run benchmark
        env:
          CREATEOS_SANDBOX_API_KEY: ${{ secrets.CREATEOS_SANDBOX_API_KEY }}
        run: |
          npx tsx benchmarks/sandbox/tti.bench.ts \
            --provider ${{ matrix.provider }} \
            --iterations ${{ github.event.inputs.iterations || '10' }} \
            --concurrency ${{ github.event.inputs.concurrency || '10' }}
      - name: Print results
        if: always()
        run: |
          echo "=== Benchmark Results ==="
          if [ -d results ]; then
            find results -name '*.json' -exec echo "--- {} ---" \; -exec cat {} \;
          else
            echo "No results directory found"
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.provider }}
          path: results/
          if-no-files-found: ignore
          retention-days: 7
