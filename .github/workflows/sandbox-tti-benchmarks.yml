name: Sandbox TTI Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/sandbox/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per provider'
        required: false
        default: '10'
      concurrency:
        description: 'Concurrent sandboxes'
        required: false
        default: '10'

permissions:
  contents: write

jobs:
  bench:
    name: Bench ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider:
          - createos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run benchmark
        env:
          CREATEOS_SANDBOX_API_KEY: ${{ secrets.CREATEOS_SANDBOX_API_KEY }}
        run: |
          npx tsx benchmarks/sandbox/tti.bench.ts \
            --provider ${{ matrix.provider }} \
            --iterations ${{ github.event.inputs.iterations || '10' }} \
            --concurrency ${{ github.event.inputs.concurrency || '10' }}
      - name: Summary
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const latest = 'results/burst_tti/latest.json';
          if (!fs.existsSync(latest)) { console.log('No results found'); process.exit(0); }
          const data = JSON.parse(fs.readFileSync(latest, 'utf-8'));
          for (const r of data.results) {
            const times = r.iterations.filter(i => !i.error).map(i => i.ttiMs).sort((a,b) => a-b);
            if (!times.length) { console.log(r.provider + ': all failed'); continue; }
            const pct = p => times[Math.min(Math.ceil(p/100*times.length)-1, times.length-1)];
            const avg = times.reduce((a,b) => a+b, 0) / times.length;
            console.log('');
            console.log('Provider: ' + r.provider);
            console.log('  Iterations: ' + r.iterations.length + ' (' + times.length + ' ok)');
            console.log('  Min:    ' + times[0].toFixed(0) + ' ms');
            console.log('  P50:    ' + pct(50).toFixed(0) + ' ms');
            console.log('  Median: ' + pct(50).toFixed(0) + ' ms');
            console.log('  P90:    ' + pct(90).toFixed(0) + ' ms');
            console.log('  P95:    ' + pct(95).toFixed(0) + ' ms');
            console.log('  P99:    ' + pct(99).toFixed(0) + ' ms');
            console.log('  Max:    ' + times[times.length-1].toFixed(0) + ' ms');
            console.log('  Avg:    ' + avg.toFixed(0) + ' ms');
          }
          "
