name: Sandbox TTI Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/sandbox/**'
      - 'benchmarks/src/util/**'
      - 'benchmarks/src/run.ts'
      - 'benchmarks/src/merge-results.ts'
      - 'package.json'
  schedule:
    - cron: '0 0 * * 5' # Weekly on Friday at midnight UTC
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per provider'
        required: false
        default: '100'
      concurrency:
        description: 'Concurrent sandboxes (sequential/staggered/burst only)'
        required: false
        default: '100'
      provider:
        description: 'Provider to run (leave empty for all)'
        required: false
        default: ''
      dry_run:
        description: 'Run without ingesting or committing results'
        required: false
        default: false
        type: boolean
      mode:
        description: 'Mode (leave empty to run all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - sequential
          - staggered
          - burst

concurrency:
  group: benchmarks
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bench:
    name: Bench ${{ matrix.provider }}
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:describe
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider:
          - archil
          - beam
          - blaxel
          - cloud-run
          - cloudflare
          - codesandbox
          # - collimate
          - createos
          - daytona
          - declaw
          - e2b
          - hopx
          - isorun
          # - lelantos
          - lightning
          - modal
          # - namespace
          - northflank
          - opencomputer
          # - quilt
          # - railway
          - runloop
          - superserve
          - tenki
          - tensorlake
          - upstash
          - vercel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.provider == '' || github.event.inputs.provider == matrix.provider
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm update
          else
            pnpm install --frozen-lockfile
          fi
      - name: Clear stale results from checkout
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.provider == '' || github.event.inputs.provider == matrix.provider
        run: rm -rf results/
      - name: Load ${{ matrix.provider }} secrets from Namespace vault
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.provider == '' || github.event.inputs.provider == matrix.provider
        run: |
          nsc version ensure --at_least 0.0.550
          node benchmarks/scripts/write-vault-envdef.mjs --mode sandbox --provider ${{ matrix.provider }} > /tmp/vault.envdef
          eval "$(nsc vault export --envdef /tmp/vault.envdef --shell=bash)"
      - name: Run benchmark
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.provider == '' || github.event.inputs.provider == matrix.provider
        run: |
          MODE_FLAG=""
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            MODE_FLAG="--mode ${{ github.event.inputs.mode }}"
          fi
          pnpm run bench -- \
            --provider ${{ matrix.provider }} \
            --iterations ${{ github.event.inputs.iterations || (github.event_name == 'push' && '10') || '100' }} \
            --concurrency ${{ github.event.inputs.concurrency || (github.event_name == 'push' && '10') || '100' }} \
            $MODE_FLAG
      - name: Upload results
        if: always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.provider == '' || github.event.inputs.provider == matrix.provider)
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.provider }}
          path: results/
          if-no-files-found: ignore
          retention-days: 7

  collect:
    name: Collect Results
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:describe
    needs: bench
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the rebase-on-push retry below has a merge base.
          # A shallow (depth-1) clone can make `git rebase origin/<branch>`
          # fail when the remote has advanced past the shallow boundary.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm update
          else
            pnpm install --frozen-lockfile
          fi
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: results-*
      - name: Merge results
        run: npx tsx benchmarks/src/merge-results.ts --input artifacts
      - name: Load ingest secrets from Namespace vault
        if: github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        continue-on-error: true  # ingest is best-effort (see the ingest step below); don't fail the job if secrets aren't seeded yet
        run: |
          nsc version ensure --at_least 0.0.550
          node benchmarks/scripts/write-vault-envdef.mjs INGEST_URL INGEST_SECRET > /tmp/vault.envdef
          eval "$(nsc vault export --envdef /tmp/vault.envdef --shell=bash)"
      - name: Ingest results to platform
        if: github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: npx tsx benchmarks/src/ingest.ts --type sandbox
      - run: pnpm run generate-svg
      - run: pnpm run generate-pricing-svg
      - name: Upload SVGs as artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-benchmark-svgs
          path: |
            results.svg
            *_tti.svg
            pricing.svg
          if-no-files-found: ignore
          retention-days: 7
      - name: Post results to merged PR
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const modes = [
              { key: 'sequential_tti', label: 'Sequential' },
              { key: 'staggered_tti', label: 'Staggered' },
              { key: 'burst_tti', label: 'Burst' },
            ];
            let body = '## Sandbox Benchmark Results\n\n';
            let hasResults = false;

            for (const mode of modes) {
              const latestPath = path.join('results', mode.key, 'latest.json');
              if (!fs.existsSync(latestPath)) continue;

              const data = JSON.parse(fs.readFileSync(latestPath, 'utf-8'));
              const results = data.results
                .filter(r => !r.skipped)
                .sort((a, b) => (b.compositeScore || 0) - (a.compositeScore || 0));

              if (results.length === 0) continue;
              hasResults = true;

              body += `### ${mode.label}\n\n`;
              body += '| # | Provider | Score | Median TTI | P95 | P99 | Status |\n';
              body += '|---|----------|-------|------------|-----|-----|--------|\n';

              results.forEach((r, i) => {
                const score = r.compositeScore !== undefined ? r.compositeScore.toFixed(1) : '--';
                const median = (r.summary.ttiMs.median / 1000).toFixed(2) + 's';
                const p95 = (r.summary.ttiMs.p95 / 1000).toFixed(2) + 's';
                const p99 = (r.summary.ttiMs.p99 / 1000).toFixed(2) + 's';
                const ok = r.iterations.filter(it => !it.error).length;
                const total = r.iterations.length;
                body += `| ${i + 1} | ${r.provider} | ${score} | ${median} | ${p95} | ${p99} | ${ok}/${total} |\n`;
              });

              body += '\n';
            }

            if (!hasResults) {
              body += '> No sandbox benchmark results were generated.\n\n';
            }

            body += `---\n*[View full run](${runUrl}) · SVGs available as [build artifacts](${runUrl}#artifacts)*`;

            // This push is a merge to master — post results to the PR it closed.
            // A commit can be associated with several PRs (backports, merge
            // queue), so pick the one merged into the branch we pushed to.
            const target = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pr = prs.find(p => p.merged_at && p.base.ref === target);
            if (!pr) {
              // Direct push with no associated PR — fall back to a commit comment.
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body,
              });
              return;
            }

            // Find and update existing comment or create new one
            const marker = '## Sandbox Benchmark Results';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
      - name: Commit and push
        if: github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json results.svg *_tti.svg pricing.svg results/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update benchmark results [skip ci]"

          # Remote master can advance during the run (concurrent runs / other
          # commits), so a plain push fails non-fast-forward. Rebase onto the
          # latest remote and retry a few times before giving up.
          branch="${GITHUB_REF#refs/heads/}"
          for attempt in 1 2 3 4 5; do
            # Rebase before each attempt (including the last) so every rebase
            # is followed by a push — otherwise the final iteration's rebase
            # would be wasted and a resolvable non-fast-forward could still fail.
            git fetch origin "${branch}"
            git rebase "origin/${branch}" || { git rebase --abort; exit 1; }
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); will rebase and retry"
          done
          echo "Failed to push after multiple attempts" >&2
          exit 1
